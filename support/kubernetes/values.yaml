---
nameOverride: frontend-vapronvapw
fullnameOverride: frontend-vapronvapw-vprw

deployment:
  containers:
    - name: frontend
      image:
        registry: docker.horse
        repository: vapronva/vapronva-pw/frontend
        tag: latest
      ports:
        - name: http
          containerPort: 3000
          protocol: TCP
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - unnecessary-addition

services:
  - name: frontend-vapronvapw
    type: ClusterIP
    ports:
      - name: http
        port: 3000
        targetPort: http
        protocol: TCP

ckic:
  enabled: true
  sites:
    - hosts:
        - vapronva.pw
      upstream: frontend-vapronvapw:3000
    - hosts:
        - vapronva.ru
      upstream: frontend-vapronvapw:3000
      extraDirectives: |
        handle /.well-known/webfinger {
          respond `{"subject":"acct:${email}","links":[{"rel":"http://openid.net/specs/connect/1.0/issuer","href":"https://auth.cmld.ru"}]}`
        }
